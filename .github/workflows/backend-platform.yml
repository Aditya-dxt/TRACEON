name: Backend and platform checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - "scanner/**"
      - "contracts/**"
      - ".github/workflows/backend-platform.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - "scanner/**"
      - "contracts/**"
      - ".github/workflows/backend-platform.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            infra/sandbox/requirements.txt
      - name: Install backend and worker dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip install -r infra/sandbox/requirements.txt
          python -m pip install pyyaml
      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head
        env:
          TRACEON_DATABASE_URL: sqlite:////tmp/traceon-ci.db
      - name: Run backend and sandbox tests
        run: pytest backend/tests infra/sandbox/tests -q
      - name: Validate deployment YAML
        run: python -c "import yaml; yaml.safe_load(open('infra/sandbox/service.yaml')); yaml.safe_load(open('infra/deploy/backend-service.yaml'))"
